[project]
name = "learning-journey"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.workspace]
members = [
    "llm-api-smoke-test",
    "courses/cs50_harvard/code/05_data_structures/speller/py_src",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
testpaths = [
    "llm-api-smoke-test/tests",
    "courses/cs50_harvard/code/05_data_structures/speller/py_src/tests",
]
