# foundations — workspace member for the Activation Plan's foundations code.
#
# Holds the Weeks 1–4 practice code (retirement.py, the dayNN scripts, mini-project #1)
# as a real, installable package so `from learning_journey.retirement import ...` works
# in tests, notebooks and later scripts.
#
# Why this is a separate member and not the root:
#   The root pyproject.toml is a workspace root with NO [build-system], so uv installs only
#   its dependencies, never a package. A member with a [build-system] IS installed (editable)
#   by `uv sync`. Same pattern as llm-api-smoke-test and the CS50 speller.

[build-system]
# setuptools on purpose: matches the two existing members. Moving all members to uv_build
# is a separate decision for an ADR, not something to do one member at a time.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name must differ from the root project ("learning-journey") — uv workspace
# member names are unique. The IMPORT name stays `learning_journey`, because setuptools
# takes it from the folder src/learning_journey/, not from this field.
name = "lj-foundations"
version = "0.1.0"
description = "Foundations practice code (Activation Plan Weeks 1-4) as an installable package."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Manuel Reyes" }]

# Stdlib only for now (csv, pathlib). Every third-party import added to src/ must be
# declared here, with a range — never rely on a transitive dependency.
dependencies = [
    "anthropic>=1.5.0,<2.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "rich>=15.0.0,<16.0.0",
    "structlog>=26.1,<27",
]

[dependency-groups]
# Same split as llm-api-smoke-test: CI's test job needs only `test`; `dev` adds linting.
# The pytest ceiling matches llm-api-smoke-test's (<10.0) so the workspace solver
# never sees two incompatible pytest ranges.
test = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.5,<1.0",
]

# =============================================================================
# Packaging
# =============================================================================

[tool.setuptools.packages.find]
where = ["src"]  # src/ layout: only code under src/ is packaged

[tool.setuptools.package-data]
# Mini-project #1 reads participants.csv next to its script. Without this line the CSV
# works in the editable install but is silently missing from a built wheel.
"learning_journey.projects" = ["*.csv"]

# =============================================================================
# pytest
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# No `pythonpath = ["src"]` on purpose. The package is installed by `uv sync`, so the
# import works the way it will for any real user. A pythonpath shim would hide exactly
# the packaging bug that produced "No module named 'learning_journey'".
addopts = [
    "-ra",                      # summary of skips/failures at the end
    "--strict-markers",         # typo in @pytest.mark.<name> fails instead of passing silently
    "--strict-config",          # typo in this table fails instead of being ignored
    "--import-mode=importlib",  # pytest's recommended mode for new projects; no unique-basename rule
]

[tool.coverage.run]
source = ["learning_journey"]

# =============================================================================
# ruff — same baseline as the other members
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PT",   # Tuple in parametrize's args.
]
# `D` (docstrings) is left out while the dayNN scripts are being typed. Turn it on with
# convention = "google" (the Args:/Raises: style the plan uses) once Week 2's
# "docstring on every function" pass is done.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
