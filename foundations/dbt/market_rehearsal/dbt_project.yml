name: market_rehearsal
profile: market_rehearsal # must match the top key in profiles.yml
version: "1.0.0"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

# -----------------------------------------------------------------------------
# FOLDER-LEVEL DEFAULTS (config inheritance)
# A value set here applies to every node in that folder. The most specific
# setting wins:  config() in the .sql file  >  the YAML entry  >  this file.
# So: set the layer's rule once here, and override in YAML only for the one
# model that is different.
#   '+' marks a line as a setting, not a folder name.
#   meta is shallow-merged: a model's own meta keys are ADDED to these; a key
#   with the same name replaces this one. Nested dictionaries are replaced, not
#   merged, so keep meta values flat (strings, numbers, booleans).
# -----------------------------------------------------------------------------

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  market_rehearsal:
    +static_analysis: "{{ env_var('DBT_ENV_STATIC_ANALYSIS', 'baseline') }}"
    +schema: raw # -> dbt_mreyes_raw in dev, raw in prod

models:
  market_rehearsal:
    # '+' marks the line as a setting rather than a folder name.
    +static_analysis: "{{ env_var('DBT_ENV_STATIC_ANALYSIS', 'baseline') }}"
    # Materialize staging models as views, and marts as tables

    # Every model belongs to the `market` group (defined in models/_groups.yml).
    # The group's `owner` is dbt's built-in answer to "who is accountable for
    # these models", so models need no meta.owner.
    +group: market

    staging:
      +materialized: view
      +schema: staging # -> db_mreyes_staging in dev, staging in prod
      # private: only models in the SAME group can ref() these. Staging is an
      # internal building block, never something a dashboard should read.
      +access: private
      +docs:
        node_color: "#4C9F70" # green in the DAG = staging layer
    intermediate:
      # dbt's guide offers ephemeral (simplest) or a view in its own schema
      # (more robust). A view lets you inspect it with `dbt show` and in DuckDB.
      +materialized: view
      +schema: intermediate # -> db_mreyes_int in dev, int in prod
      +access: private
      +docs:
        node_color: "#E3A33B" # amber = intermediate layer
    marts:
      +materialized: table
      +schema: marts # -> db_mreyes_marts in dev, marts in prod
      # public: anything may ref() these, including other dbt projects (dbt
      # Mesh). Public models are the ones dbt recommends putting a contract on.
      +access: public
      +docs:
        node_color: "#2F6DB5" # blue = marts layer
      +meta:
        # Every new mart starts at `low`. A model is promoted in its own YAML
        # entry once it earns it (see models/marts/market/_market__models.yml):
        #   low    = new or experimental; may change without notice
        #   medium = contract + tests (incl. a unit test); changes are announced
        #   high   = medium + real consumers (exposures) + stable for a while
        # Same low/medium/high scale dbt uses for an exposure's built-in maturity.
        maturity: low

data_tests:
  market_rehearsal:
    # Your singular tests in tests/ ref() private staging/intermediate models.
    # A node outside the `market` group may not ref() a private model, so
    # without this line `dbt parse` fails with "...is private to the 'market'
    # group". Tests are allowed group members, so put them in the group too.
    +group: market
