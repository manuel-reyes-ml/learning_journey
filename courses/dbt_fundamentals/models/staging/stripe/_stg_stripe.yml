models:
  - name: stg_stripe_payments
    description: Staged payments data from our stripe schema
    columns:
      - name: payment_id
        description: The primary key for payments.
        data_tests:
          - unique
          - not_null
      - name: payment_method
        description: "{{doc('payments_methods')}}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'bank_transfer', 'coupon', 'gift_card']
      - name: status
        description: "{{doc('payments_status')}}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'fail']
      - name: order_id
        description: The foreign key to stg_orders.order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop_orders')
                field: order_id