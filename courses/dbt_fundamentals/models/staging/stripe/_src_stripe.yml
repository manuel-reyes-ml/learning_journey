sources:
  - name: stripe
    description: A clone of a Postgres database
    database: raw
    schema: stripe
    tables:
      - name: payment
        description: Raw payments data
        columns:
          - name: id
            description: Primary key
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour