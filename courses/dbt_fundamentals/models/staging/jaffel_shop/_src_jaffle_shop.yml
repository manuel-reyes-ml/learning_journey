sources:
  - name: jaffle_shop
    description: A clone of a Postgres database  # source level
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer data  # table level
        columns:
          - name: id
            description: primary key  # column level
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw order data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: _etl_loaded_at
          # identify how old our newest record is
          # if the loader tool or warehouse have an issue
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour